name: Test FastAPI Example

on:
  push:
    branches: [main]
    paths:
      - 'fastapi/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fastapi/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'fastapi/requirements.txt'

      - name: Install dependencies
        working-directory: fastapi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax
        working-directory: fastapi
        run: |
          python -m py_compile app/main.py app/db.py app/auth.py app/models.py app/schemas.py app/dependencies.py app/errors.py
          find app/routers -name "*.py" -exec python -m py_compile {} +

      - name: Verify imports (without runtime)
        working-directory: fastapi
        run: |
          # Just check that all modules can be imported syntactically
          # (full import test requires DATABASE_URL and a real Postgres)
          python -c "import app.main, app.db, app.auth, app.models, app.schemas, app.dependencies, app.errors, app.routers.auth, app.routers.customers, app.routers.products, app.routers.carts, app.routers.orders, app.routers.payments, app.routers.shipments; print('✓ All modules import successfully')"
