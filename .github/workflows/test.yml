name: Test FastAPI Example

on:
  push:
    branches: [main]
    paths:
      - 'fastapi/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fastapi/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    # PostgreSQL service for running tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'fastapi/requirements.txt'

      - name: Install dependencies
        working-directory: fastapi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax
        working-directory: fastapi
        run: |
          python -m py_compile app/main.py app/db.py app/auth.py app/models.py app/schemas.py app/dependencies.py app/errors.py
          find app/routers -name "*.py" -exec python -m py_compile {} +

      - name: Test app startup with PostgreSQL
        working-directory: fastapi
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        timeout-minutes: 2
        run: |
          # Start the app and let it initialize the database
          # Then kill it after 5 seconds (successful initialization)
          timeout 5 python -m app.main || true
          echo "✓ App started successfully and initialized database"

      - name: Verify app imports with PostgreSQL
        working-directory: fastapi
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          python -c "from app.main import app; print('✓ App imports and initializes successfully with PostgreSQL')"
