name: Test FastAPI Example

on:
  push:
    branches: [main]
    paths:
      - 'fastapi/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fastapi/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'fastapi/requirements.txt'

      - name: Install dependencies
        working-directory: fastapi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax
        working-directory: fastapi
        run: |
          python -m py_compile app/main.py app/db.py app/auth.py app/models.py app/schemas.py app/dependencies.py app/errors.py
          find app/routers -name "*.py" -exec python -m py_compile {} +

      - name: Import app
        working-directory: fastapi
        run: python -c "from app.main import app; print('✓ App imports successfully')"

      - name: Run basic startup test
        working-directory: fastapi
        timeout-minutes: 1
        run: |
          timeout 5 python -m app.main || true
